name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  livekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/livekit/requirements.txt
      - name: Test speech and signaling
        run: python -m unittest discover -s backend/livekit -p 'test_*.py' -v
      - name: Test deployment gate
        run: python -m unittest discover -s backend/deploy -p 'test_*.py' -v
      - name: Build supervised LiveKit image
        run: docker build -t syncup-livekit-ci backend/livekit
      - name: Validate deployment configuration
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_PUBLISHABLE_KEY: test-key
          LIVEKIT_API_KEY: test-key
          LIVEKIT_API_SECRET: test-secret-at-least-32-characters
          LIVEKIT_PUBLIC_IP: 127.0.0.1
          SYNCUP_DOMAIN: example.invalid
        run: |
          docker compose -f backend/deploy/compose.yaml config --quiet
          docker run --rm -i -e SYNCUP_DOMAIN caddy:2.10.2-alpine caddy validate --adapter caddyfile --config /dev/stdin < backend/deploy/Caddyfile

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Supabase CLI
        run: npm ci
      - name: Start isolated local Supabase
        run: npx supabase start > /dev/null
      - name: Test schema and policies
        run: |
          for test in supabase/tests/*.sql; do
            echo "Running $test"
            docker exec -i supabase_db_backend psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$test"
          done
