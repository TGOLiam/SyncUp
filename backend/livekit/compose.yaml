# Development only: services use local test credentials and unencrypted HTTP.
services:
  livekit:
    build: .
    network_mode: host
    environment:
      SYNCUP_SUPABASE_INTERNAL_URL: http://127.0.0.1:54321
      SYNCUP_SUPABASE_PUBLISHABLE_KEY: ${SYNCUP_SUPABASE_PUBLISHABLE_KEY:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      SYNCUP_LAN_ADDRESS: ${SYNCUP_LAN_ADDRESS:-127.0.0.1}
      LIVEKIT_URL: ws://${SYNCUP_LAN_ADDRESS:-127.0.0.1}:7883
